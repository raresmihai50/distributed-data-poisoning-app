# Portul serverului Java
server.port=8080

# Activare Virtual Threads (Java 21 Project Loom)
spring.threads.virtual.enabled=true

# Limită upload imagini
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# URL-ul către microserviciul Python FastAPI
ai.worker.url=http://localhost:8000